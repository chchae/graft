[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "graft"
version = "0.1.0"
description = "Iterative molecular lead-optimization pipeline using REINVENT4, Schrödinger, SQLite, MM-GBSA and FEP staging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit",
    "numpy",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
]

[project.scripts]
graft = "graft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.11"

